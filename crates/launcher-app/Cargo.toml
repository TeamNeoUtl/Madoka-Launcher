[package]
name = "launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop application of Madoka Launcher."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "Madoka-Launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_m3 = { git = "https://github.com/TeamNeoUtl/iced-md3", default-features = false, features = ["expressive-defaults"] }
interprocess = "2"
launcher-core = { path = "../launcher-core" }
launcher-providers = { path = "../launcher-providers" }
fontdb = "0.24"
percent-encoding = "2"
pulldown-cmark = "0.13"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rust-i18n = "4.2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "process", "io-util"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
resvg = { version = "0.49", default-features = false }
embed-resource = "3"
