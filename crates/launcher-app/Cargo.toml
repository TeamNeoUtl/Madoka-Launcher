[package]
name = "launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "MLAYN-Launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_m3 = { git = "https://github.com/tpaau/iced_m3.git", default-features = false, features = ["expressive-defaults"] }
launcher-core = { path = "../launcher-core" }
launcher-providers = { path = "../launcher-providers" }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1"
url = "2.5.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
