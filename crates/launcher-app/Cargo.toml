[package]
name = "launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop application of Madoka Launcher."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "Madoka-Launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_m3 = { git = "https://github.com/tpaau/iced_m3.git", default-features = false, features = ["expressive-defaults"] }
launcher-core = { path = "../launcher-core" }
launcher-providers = { path = "../launcher-providers" }
fontdb = "0.24"
percent-encoding = "2"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util"] }
tracing = "0.1"
url = "2.5.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
