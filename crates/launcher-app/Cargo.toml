[package]
name = "launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "MLAYN-Launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
iced_m3 = { git = "https://github.com/tpaau/iced_m3.git", rev = "89e45c811b7a603d8aecdbfc9d04909b8f7a95a4", default-features = false, features = ["expressive-defaults"] }
launcher-core = { path = "../launcher-core" }
launcher-providers = { path = "../launcher-providers" }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
