[package]
name = "launcher-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "MLAYN-Launcher"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
launcher-core = { path = "../launcher-core" }
launcher-providers = { path = "../launcher-providers" }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt"] }
