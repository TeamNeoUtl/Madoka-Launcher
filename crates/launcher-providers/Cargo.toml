[package]
name = "launcher-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Catalog and release providers of Madoka Launcher."
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
launcher-core = { path = "../launcher-core" }
percent-encoding = "2"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
self_update = { version = "1", default-features = false, features = ["reqwest", "rustls", "github", "archive-zip", "compression-zip-deflate", "compression-tar-gz", "checksums"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net"] }
url = "2"
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
