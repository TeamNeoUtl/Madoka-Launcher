[package]
name = "launcher-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
launcher-core = { path = "../launcher-core" }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util"] }
url = "2.5.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
