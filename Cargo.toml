[workspace]
resolver = "3"
members = [
    "crates/launcher-core",
    "crates/launcher-providers",
    "crates/launcher-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
